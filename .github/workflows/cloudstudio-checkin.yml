name: Cloud Studio daily check-in

on:
  schedule:
    - cron: '17 23 * * *' # UTC; 每天北京时间 07:17 启动
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudstudio-daily-checkin
  cancel-in-progress: false

jobs:
  check-in:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Wait for a random morning time
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          wait_minutes=$(shuf -i 43-282 -n 1)
          echo "Waiting ${wait_minutes} minutes before check-in."
          sleep "$((wait_minutes * 60))"
      - name: Claim daily reward
        env:
          CLOUDSTUDIO_COOKIE: ${{ secrets.CLOUDSTUDIO_COOKIE }}
        run: python cloudstudio_checkin.py
