name: Cloud Studio daily check-in

on:
  schedule:
    - cron: '23 0 * * *' # UTC; 北京时间 08:23
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudstudio-daily-checkin
  cancel-in-progress: false

jobs:
  check-in:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Claim daily reward
        env:
          CLOUDSTUDIO_COOKIE: ${{ secrets.CLOUDSTUDIO_COOKIE }}
        run: python cloudstudio_checkin.py
