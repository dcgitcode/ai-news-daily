name: Cloud Studio daily check-in

# 同样改由外部调度器触发。原实现在 runner 上 sleep 43-282 分钟做随机延迟，
# 属于长时间空转占用，既违反 GitHub 使用限制、又容易在中途被回收，
# 现在随机性交给调度端（如需）或直接固定时间。签到是调用内部接口，
# 固定时间不会被判定为异常。
on:
  repository_dispatch:
    types: [cloudstudio-checkin]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudstudio-daily-checkin
  cancel-in-progress: false

jobs:
  check-in:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Claim daily reward
        env:
          CLOUDSTUDIO_COOKIE: ${{ secrets.CLOUDSTUDIO_COOKIE }}
        run: python cloudstudio_checkin.py
      - name: Alert on cookie or request failure
        if: failure()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.163.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY || 'ssl' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ALERT_SUBJECT: '[ai-news-daily] Cloud Studio 签到失败'
          ALERT_BODY: |
            工作流：${{ github.workflow }}
            运行编号：${{ github.run_number }}
            日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            最可能的原因：CLOUDSTUDIO_COOKIE 已过期。
            请重新登录 cloudstudio.net，从浏览器复制完整 Cookie 请求头，
            更新到仓库 Secrets -> CLOUDSTUDIO_COOKIE。
        run: python notify_failure.py
