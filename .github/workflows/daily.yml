name: AI news daily

# 不再使用 GitHub 自带的 schedule：公共仓库连续 60 天无活动会被自动停用，
# 且整点/半点负载高峰时 schedule 会延迟甚至被丢弃。
# 改由外部调度器（Cloudflare Workers Cron / cron-job.org / 腾讯云函数）
# 调用 repository_dispatch 触发，时间可控、不会被停用。
on:
  repository_dispatch:
    types: [daily-digest]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only collect and render; do not send'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ai-news-daily
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Resolve dry-run flag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY_RUN=true" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ] && [ "${{ github.event.client_payload.dry_run }}" = "true" ]; then
            echo "DRY_RUN=true" >> "$GITHUB_ENV"
          else
            echo "DRY_RUN=false" >> "$GITHUB_ENV"
          fi
      - name: Restore persistent delivery state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p state
          remote_state=$(git ls-remote --heads origin refs/heads/digest-state)
          if [ -n "$remote_state" ]; then
            git fetch origin digest-state
            git show FETCH_HEAD:delivery.json > state/delivery.json
          fi
      - name: Collect and deliver
        env:
          CHANNELS: email
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.163.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY || 'ssl' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            python -m news_digest --dry-run
          else
            python -m news_digest
          fi
      - name: Persist state even after partial delivery failure
        if: ${{ always() && hashFiles('state/delivery.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          remote_state=$(git ls-remote --heads origin refs/heads/digest-state)
          if [ -n "$remote_state" ]; then
            git fetch origin digest-state
            git worktree add /tmp/digest-state FETCH_HEAD
          else
            git worktree add --detach /tmp/digest-state HEAD
            git -C /tmp/digest-state checkout --orphan digest-state
            git -C /tmp/digest-state rm -rf .
          fi
          cp state/delivery.json /tmp/digest-state/delivery.json
          git -C /tmp/digest-state add delivery.json
          if ! git -C /tmp/digest-state diff --cached --quiet; then
            git -C /tmp/digest-state commit -m 'Update delivery deduplication state'
            git -C /tmp/digest-state push origin HEAD:refs/heads/digest-state
          fi
      - name: Alert on failure
        if: failure()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.163.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY || 'ssl' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ALERT_SUBJECT: '[ai-news-daily] 日报任务失败'
          ALERT_BODY: |
            工作流：${{ github.workflow }}
            触发方式：${{ github.event_name }}
            运行编号：${{ github.run_number }}
            日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            常见原因：SMTP 授权码失效、Secrets 缺失、所有新闻源抓取失败。
        run: python notify_failure.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-news-report-${{ github.run_number }}
          path: reports/
          retention-days: 7
          if-no-files-found: ignore
